<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Nutrition Quiz</title><style>body{background:#fff0f5;padding:15px;font-family:system-ui}.c{max-width:650px;margin:auto;background:#fff;padding:22px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}h1{color:#d81b60;text-align:center;font-size:22px}.q{background:#fff5f8;padding:13px;margin:15px 0;border-radius:12px;border-left:5px solid #ec407a}.q b{display:block;margin-bottom:9px}label{display:block;background:#fafafa;margin:6px 0;padding:9px;border-radius:8px;border:1px solid #eee;cursor:pointer}label:hover{background:#fce4ec}button{background:#ec407a;color:#fff;border:0;padding:13px;width:100%;border-radius:12px;font-size:16px;margin-top:12px;cursor:pointer;font-weight:bold}</style></head><body><div class=c><h1>🌸 Nutrition Quiz - Nirmeen 🌸</h1><div id=qq></div><button onclick=R()>Show Result 💖</button><div id=sc style=text-align:center;margin-top:18px;font-size:20px;color:#d81b60;line-height:1.6></div></div><script>Q=[["What are Physical factors affecting nutrition?","Chewing and swallowing ability","Mood","Income",0],["Psychological factors include:","Depression and loss of appetite","Height","Climate",0],["What is normal BMI?","18.5-24.9","25-29.9",">30",0],["Socio-cultural factors include:","Food habits and religion","Cooking ability","Medications",0],["Depression leads to:","Loss or increase of appetite","Increase in height","Better digestion",0],["Which is Anthropometric measurement?","Weight, height, BMI","Blood test","Blood pressure",0],["Sign of malnutrition (Physical):","Weight loss and hair loss","Happiness","Activity",0],["Low income affects:","Quality and quantity of food","Skin color","Height",0],["Dietary assessment includes:","24-hour recall & Food frequency","Weight only","Blood test only",0],["Biochemical tests like:","Hemoglobin and Albumin","Height","Observation",0]];let H="";Q.forEach((x,i)=>{H+=`<div class=q><b>${i+1}. ${x[0]}</b>`;for(j=1;j<=3;j++)H+=`<label><input type=radio name=q${i} value=${j-1}> ${x[j]}</label>`;H+=`</div>`});document.getElementById("qq").innerHTML=H;function R(){let s=0,m=0;Q.forEach((x,i)=>{let c=document.querySelector(`input[name=q${i}]:checked`);if(!c)m++;else if(c.value==x[4])s++});if(m>0){alert("Please answer all questions! Remaining: "+m);return}let p=Math.round(s/Q.length*100);let msg=s>=8?"Excellent Dr. Nirmeen! 😍🎉":s>=5?"Great job! 💪💖":"Keep revising! 💪";document.getElementById("sc").innerHTML=`${msg}<br><br>You got <b>${s}</b> out of <b>${Q.length}</b><br>${p}%<br>🌸`}</script></body></html>
