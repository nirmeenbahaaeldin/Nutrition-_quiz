<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nutrition Quiz</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');*{font-family:'Cairo',sans-serif;box-sizing:border-box}body{background:#f0f4ff;margin:0;padding:15px}.box{max-width:700px;margin:auto}.head{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px;border-radius:18px;text-align:center}.card{background:#fff;padding:22px;border-radius:18px;margin-top:18px;box-shadow:0 4px 15px rgba(0,0,0,.07)}.opt{padding:13px;border:2px solid #e5e7f0;border-radius:12px;margin:8px 0;cursor:pointer}.opt:hover{border-color:#667eea;background:#f3f4ff}.opt.ok{border-color:#00c853;background:#e8f5e9}.opt.bad{border-color:#ff1744;background:#ffebee}.bar{height:10px;background:#fff;border-radius:10px;margin-top:15px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);width:0%;transition:.3s}#fb{margin-top:12px;padding:10px;border-radius:10px;display:none;font-weight:700}#fb.show{display:block}#fb.ok{background:#e8f5e9;color:#2e7d32}#fb.bad{background:#ffebee;color:#c62828}button{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:700;margin-top:12px;display:none}button.show{display:block}</style></head><body><div class="box"><div class="head"><h2>💖 Nutritional Assessment Quiz</h2><p>دوسي على الإجابة وهتعرفي صح ولا غلط فوراً</p><div class="bar"><div class="fill" id="fill"></div></div><div style="display:flex;justify-content:space-between;margin-top:5px;font-size:13px"><span id="cnt">1 / 31</span><span id="sc">0</span></div></div><div id="root"></div></div><script>const Q=[{q:"Which can cause difficulty when eating?",o:["Poor oral hygiene","Sore mouth","Ill-fitting dentures","All of the above"],a:3},{q:"Halitosis indicates?",o:["Good oral hygiene","Poor oral hygiene or dehydration","Good nutrition","Stress only"],a:1},{q:"Sunken eye sockets suggestive of?",o:["Malnutrition","Dehydration","Overhydration","Good health"],a:1},{q:"Dull, lifeless hair indicates?",o:["Good nutrition","Poor nutritional status","Dehydration only","Good hygiene"],a:1},{q:"Dry, scaly skin may indicate?",o:["Well nourished","Malnourished or dehydrated","Overhydrated","Allergy"],a:1},{q:"Which prevents eating even if hungry?",o:["Constipation","Nausea and vomiting","Sunken eyes","Dry skin"],a:1},{q:"Diarrhea or constipation can lead to?",o:["Dehydration only","Malabsorption","Good appetite","Better nutrition"],a:1},{q:"Which requires special restricted diet?",o:["Renal disease & Diabetes","Anorexia","Busy lifestyle","Cultural"],a:0},{q:"Depressed or bereaved affecting appetite is?",o:["Physical","Psychological","Environmental","Socio-cultural"],a:1},{q:"Anorexia & bulimia are?",o:["Physical","Deviations in eating patterns","Environmental","Cultural"],a:1},{q:"Neglecting diet due to busy stressful life is?",o:["Socio-cultural","Psychological","Physical","Environmental"],a:1},{q:"Belief diet incomplete without daily hot meal is?",o:["Religious","Cultural","Psychological","Physical"],a:1},{q:"Religious beliefs influencing diet belongs to?",o:["Physical","Psychological","Socio-cultural","Environmental"],a:2},{q:"Diet too restricted due to wrong info is?",o:["Cultural","Spurious health beliefs","Depression","Allergy"],a:1},{q:"Adequate food preparation equipment is?",o:["Psychological","Physical","Environmental","Socio-cultural"],a:2},{q:"Shops or supermarkets in vicinity assesses?",o:["Ability to obtain food","Religious beliefs","Mental state","Oral hygiene"],a:0},{q:"Appetite affected by hospital smells is?",o:["Physical","Environmental","Psychological","Socio-cultural"],a:1},{q:"Nutritional screening should be?",o:["Only malnourished","Initially on all patients using validated tool","Only doctor orders","After one week"],a:1},{q:"Nutritional assessment is used only to evaluate status. (صح/غلط)",o:["صح","غلط"],a:1},{q:"Dry scaly skin may indicate malnourished or dehydrated. (صح/غلط)",o:["صح","غلط"],a:0},{q:"Dull lifeless hair indicates good nutrition. (صح/غلط)",o:["صح","غلط"],a:1},{q:"Nausea & vomiting will help clients to eat more. (صح/غلط)",o:["صح","غلط"],a:1},{q:"Deterioration in consciousness may affect desire to eat. (صح/غلط)",o:["صح","غلط"],a:0},{q:"Stress & anxiety can suppress appetite. (صح/غلط)",o:["صح","غلط"],a:0},{q:"Depression has no effect on appetite. (صح/غلط)",o:["صح","غلط"],a:1},{q:"Cultural attitudes do not influence diet. (صح/غلط)",o:["صح","غلط"],a:1},{q:"Being vegetarian/vegan is socio-cultural factor. (صح/غلط)",o:["صح","غلط"],a:0},{q:"Spurious health beliefs can cause too restricted diet. (صح/غلط)",o:["صح","غلط"],a:0},{q:"Environmental assessment is part of nutritional assessment. (صح/غلط)",o:["صح","غلط"],a:0},{q:"Shops in vicinity is not relevant. (صح/غلط)",o:["صح","غلط"],a:1},{q:"Unpleasant smells in hospital can affect appetite. (صح/غلط)",o:["صح","غلط"],a:0}];let i=0,s=0;function render(){if(i>=Q.length){document.getElementById('root').innerHTML=`<div class=card style=text-align:center><h2>خلصتي! 🎉</h2><h1>${s} / ${Q.length}</h1><p>${s>=25?'ممتازة 🌟':s>=18?'شطورة 👏':'محتاجة مراجعة 💪'}</p><button class=show onclick='i=0;s=0;render()'>إعادة</button></div>`;return}let q=Q[i];document.getElementById('cnt').innerText=(i+1)+' / '+Q.length;document.getElementById('sc').innerText='الدرجة: '+s;document.getElementById('fill').style.width=((i+1)/Q.length*100)+'%';let h=`<div class=card><b>سؤال ${i+1}</b><p style=font-size:18px;font-weight:700;margin:12px 0>${q.q}</p>`;q.o.forEach((op,k)=>{h+=`<div class=opt id=op${k} onclick=check(${k})>${String.fromCharCode(65+k)}. ${op}</div>`});h+=`<div id=fb></div><button id=nx onclick='i++;render()'>التالي ➡️</button></div>`;document.getElementById('root').innerHTML=h}function check(k){let q=Q[i];let fb=document.getElementById('fb');let nx=document.getElementById('nx');document.querySelectorAll('.opt').forEach(e=>e.style.pointerEvents='none');if(k===q.a){document.getElementById('op'+k).classList.add('ok');fb.innerText='✅ صح برافو!';fb.className='';fb.id='fb';fb.classList.add('show','ok');s++;}else{document.getElementById('op'+k).classList.add('bad');document.getElementById('op'+q.a).classList.add('ok');fb.innerText='❌ غلط - الصح: '+q.o[q.a];fb.classList.add('show','bad');}document.getElementById('sc').innerText='الدرجة: '+s;fb.style.display='block';nx.classList.add('show');}render();</script></body></html>
