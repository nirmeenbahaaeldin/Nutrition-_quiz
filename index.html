<!DOCTYPE html><html dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Quiz</title><style>body{background:#fff0f5;padding:15px;font-family:system-ui}.c{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:20px}h1{color:#d81b60;text-align:center;font-size:20px}.q{background:#fff5f8;padding:12px;margin:14px 0;border-radius:12px;border-right:4px solid #ec407a}.q b{display:block;margin-bottom:8px}label{display:block;background:#fafafa;margin:6px 0;padding:8px;border-radius:8px;border:1px solid #eee}button{background:#ec407a;color:#fff;border:0;padding:13px;width:100%;border-radius:10px;font-size:16px;margin-top:10px}</style></head><body><div class=c><h1>🌸 امتحان Nutrition - نيرمين 🌸</h1><div id=qq></div><button onclick=R()>عرض النتيجة 💖</button><div id=sc style=text-align:center;margin-top:15px;font-size:20px;color:#d81b60></div></div><script>Q=[["العوامل Physical تشمل؟","المضغ والبلع","المزاج","الدخل",0],["العوامل Psychological؟","الاكتئاب وفقدان الشهية","الطول","المناخ",0],["BMI الطبيعي؟","18.5-24.9","25-29.9",">30",0],["العوامل Socio-cultural؟","العادات والدين","القدرة على الطهي","الادوية",0],["الاكتئاب يؤدي الى؟","فقدان او زيادة الشهية","زيادة الطول","تحسن الهضم",0]];let H="";Q.forEach((x,i)=>{H+=`<div class=q><b>${i+1}. ${x[0]}</b>`;for(j=1;j<=3;j++)H+=`<label><input type=radio name=q${i} value=${j-1}> ${x[j]}</label>`;H+=`</div>`});document.getElementById("qq").innerHTML=H;function R(){let s=0,m=0;Q.forEach((x,i)=>{let c=document.querySelector(`input[name=q${i}]:checked`);if(!c)m++;else if(c.value==x[4])s++});if(m>0){alert("جاوبي على كل الاسئلة! فاضل "+m);return}document.getElementById("sc").innerHTML=`برافو! جبتي ${s} من ${Q.length} 🎉`}</script></body></html>
